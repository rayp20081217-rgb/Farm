<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAYP Farm | Farm Monetary System</title>

    <link rel="icon" type="image/png" href="logo.png">

    <meta name="theme-color" content="#2e7d32">

    <meta name="description"
        content="RAYP Farm Farm Monetary System">

    <link rel="stylesheet" href="index.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="login-page">

    <!-- Floating Background Icons -->

    <div class="floating-icons">

        <i class="fas fa-seedling"></i>
        <i class="fas fa-cow"></i>
        <i class="fas fa-tractor"></i>
        <i class="fas fa-wheat-awn"></i>
        <i class="fas fa-leaf"></i>
        <i class="fas fa-apple-whole"></i>

    </div>

    <!-- Theme Toggle -->

    <button class="theme-btn" id="themeBtn" title="Change Theme">

        <i class="fas fa-moon"></i>

    </button>

    <!-- Login Card -->

    <div class="login-container">

        <header class="navbar">

            <div class="logo">

                <img src="logo.png" alt="RAYP Farm">

                <h2>RAYP Farm</h2>

            </div>

        </header>

        <main>

            <h1>Welcome Back!</h1>

            <p class="welcome-text">

                Sign in to manage your Farm Monetary System.

            </p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    required>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                    <i class="fas fa-eye" id="togglePassword"></i>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox" id="remember">

                        Remember Me

                    </label>

                    <a href="forgot-password.html">

                        Forgot Password?

                    </a>

                </div>

                <button
                    type="submit"
                    id="loginBtn">

                    <span id="btnText">

                        Login

                    </span>

                    <span class="loader" id="loader"></span>

                </button>

            </form>

            <p id="msg"></p>

            <div class="register-link">

                Don't have an account?

                <a href="register.html">

                    Create Account

                </a>

            </div>

        </main>

        <footer>

            © 2026 <strong>RAYP Farm</strong>. All Rights Reserved.

        </footer>

    </div>

    <script src="login.js"></script>
    <script src="settings.js"></script>

    <script>

        /* PASSWORD TOGGLE */

        const password = document.getElementById("password");
        const eye = document.getElementById("togglePassword");

        eye.onclick = function () {

            if (password.type === "password") {

                password.type = "text";

                eye.classList.replace("fa-eye", "fa-eye-slash");

            } else {

                password.type = "password";

                eye.classList.replace("fa-eye-slash", "fa-eye");

            }

        };



        /* DARK MODE */

        const themeBtn = document.getElementById("themeBtn");

        themeBtn.onclick = function () {

            document.body.classList.toggle("light-mode");

            if (document.body.classList.contains("light-mode")) {

                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';

            } else {

                themeBtn.innerHTML = '<i class="fas fa-moon"></i>';

            }

        };



        /* LOGIN ANIMATION */

        const loginForm = document.getElementById("loginForm");

        const loader = document.getElementById("loader");

        const btnText = document.getElementById("btnText");

        loginForm.addEventListener("submit", function (e) {

            e.preventDefault();

            loader.style.display = "inline-block";

            btnText.style.display = "none";

            login();

        });

    </script>

</body>

</html>
